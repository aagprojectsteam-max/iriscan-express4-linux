name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 dpkg-dev zip
      - name: Build, test fixtures, audit privacy and package
        run: bash scripts/check.sh
